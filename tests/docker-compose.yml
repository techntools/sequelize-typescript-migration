services:
  mysql:
    image: mysql/mysql-server:8.0
    container_name: sequelize-typescript-migrations-mysql
    restart: on-failure:2
    environment:
      MYSQL_ROOT_PASSWORD: R001
      MYSQL_USER: santosh
      MYSQL_PASSWORD: Sant0sh
    ports:
      - "3306:3306"
    volumes:
      - sequelize_typescript_migrations_mysql_data:/var/lib/mysql

  mariadb:
    image: mariadb:11.4
    container_name: sequelize-typescript-migrations-mariadb
    restart: on-failure:2
    environment:
      MARIADB_ROOT_PASSWORD: R001
      MARIADB_USER: santosh
      MARIADB_PASSWORD: Sant0sh
    ports:
      - "3307:3306"
    volumes:
      - sequelize_typescript_migrations_mariadb_data:/var/lib/mysql

  postgis:
    image: postgis/postgis:16-3.4
    container_name: sequelize-typescript-migrations-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: santosh
      POSTGRES_PASSWORD: Sant0sh
    ports:
      - "5432:5432"
    volumes:
      - sequelize_typescript_migrations_postgis_data:/var/lib/postgresql/data


volumes:
  sequelize_typescript_migrations_mysql_data:
  sequelize_typescript_migrations_mariadb_data:
  sequelize_typescript_migrations_postgis_data:
